; Common kinds of value written as rules. Each pattern has a format, so
; people see words instead of the regular expression.

[log]
level=info

[@section look]
title=Colours

[@rule look.background]
type=enum
values=black,white,red,green,blue,yellow,SteelBlue,DarkOliveGreen,LightGoldenrodYellow
doc=A colour by name (a few X11 names)

[@rule look.accent]
pattern=#[0-9A-Fa-f]{6}
format=#RRGGBB in hex (e.g. #4682B4)
doc=A colour by number

[@section event]
title=Dates and times

[@rule event.date]
pattern=[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])
format=YYYY-MM-DD (e.g. 2026-11-05)
doc=A date; the pattern doesn't know how many days a month has

[@rule event.open]
pattern=(?i)(0?[1-9]|1[0-2]):[0-5][0-9] ?[ap]m
format=12-hour time with am or pm (e.g. 7:30 PM)
doc=Opening time

[@rule event.close]
pattern=([01][0-9]|2[0-3]):[0-5][0-9]
format=HH:MM, 24-hour (e.g. 21:45)
doc=Closing time

[@rule event.timezone]
pattern=[A-Za-z_]+(/[A-Za-z0-9_+-]+)*
format=a time zone name (e.g. America/New_York)
doc=Time zone

[@section window]
title=Window

[@rule window.geometry]
pattern=[1-9][0-9]*x[1-9][0-9]*([+-][0-9]+[+-][0-9]+)?
format=WIDTHxHEIGHT, optionally with a position (e.g. 640x480 or 640x480-0+0)
doc=Window size and position, X11 style

[@section net]
title=Network

[@rule net.host]
pattern=[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*
format=a host name (e.g. signage-07.example.com)
doc=Server to connect to

[@rule net.ipv4]
pattern=((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])
format=an IPv4 address (e.g. 192.168.1.20)
doc=Fixed address

[@rule net.port]
type=int
min=1
max=65535
format=a number from 1 to 65535
doc=Port

[@rule net.url]
pattern=https?://[^\s/?#]+[^\s]*
format=a web address starting with http:// or https://
doc=Where prices come from

[@rule net.email]
pattern=[^@\s]+@[^@\s]+\.[^@\s]+
format=an email address (e.g. it@example.com)
doc=Who to tell about problems

[@section job]
title=Sizes and durations

[@rule job.timeout]
pattern=([0-9]+(ms|s|m|h|d))+
format=a duration such as 90s, 15m or 1h30m
doc=How long a job may run

[@rule job.cache]
pattern=(?i)[0-9]+ ?(b|kb|mb|gb|tb)
format=a size such as 512mb or 2 GB
doc=Cache size

[@rule job.percent]
type=int
min=0
max=100
format=a percentage, 0 to 100
doc=Disk use that triggers cleanup

[@section log]
title=Logging

[@rule log.level]
type=enum
values=debug,info,warn,error
doc=How much to log

[@section app]
title=Identity

[@rule app.id]
pattern=[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}
format=a UUID (e.g. 123e4567-e89b-12d3-a456-426614174000)
doc=Unique ID of this install

[@rule app.version]
pattern=[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?
format=a version number such as 2.4.1 or 2.5.0-beta.1
doc=Version

[@rule app.locale]
pattern=[a-z]{2,3}(-[A-Z]{2})?
format=language code, optionally with region (e.g. en-US)
prompt=Which language and region?
doc=Language for dates and numbers
