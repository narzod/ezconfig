; Common kinds of value. Most use a built-in type (type=x11color,
; type=date...), which checks the value properly and describes itself;
; the rest are patterns with a format, for kinds with no built-in type.

[log]
level=info

[@section look]
title=Colors

[@rule look.background]
type=x11color
doc=A color by name

[@rule look.accent]
type=hexcolor
doc=A color by number

[@section event]
title=Dates and times

[@rule event.date]
type=date
doc=A date, checked against the calendar

[@rule event.open]
type=time12
doc=Opening time

[@rule event.close]
type=time
doc=Closing time

[@rule event.timezone]
type=timezone
doc=Time zone

[@section net]
title=Network

[@rule net.host]
type=host
doc=Server to connect to

[@rule net.ipv4]
type=ipv4
doc=Fixed address

[@rule net.port]
type=port
doc=Port

[@rule net.url]
type=url
doc=Where prices come from

[@rule net.email]
type=email
doc=Who to tell about problems

[@section job]
title=Sizes and durations

[@rule job.timeout]
type=duration
doc=How long a job may run

[@rule job.cache]
type=size
doc=Cache size

[@rule job.percent]
type=int
min=0
max=100
format=a percentage, 0 to 100
doc=Disk use that triggers cleanup

[@section log]
title=Logging

[@rule log.level]
type=enum
values=debug,info,warn,error
doc=How much to log

; No built-in type for these yet: a pattern and a format.

[@section window]
title=Window

[@rule window.geometry]
pattern=[1-9][0-9]*x[1-9][0-9]*([+-][0-9]+[+-][0-9]+)?
format=WIDTHxHEIGHT, optionally with a position, e.g. 640x480 or 640x480-0+0
doc=Window size and position, X11 style

[@section app]
title=Identity

[@rule app.id]
pattern=[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}
format=a UUID, e.g. 123e4567-e89b-12d3-a456-426614174000
doc=Unique ID of this install

[@rule app.version]
pattern=[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?
format=a version number such as 2.4.1 or 2.5.0-beta.1
doc=Version

[@rule app.locale]
pattern=[a-z]{2,3}(-[A-Z]{2})?
format=language code, optionally with region, e.g. en-US
prompt=Which language and region?
doc=Language for dates and numbers
