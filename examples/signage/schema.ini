; Schema for a digital signage player.
; Ordinary sections are defaults; [schema.*] blocks are rules, one per key.

[player]
name=player
debug=no
autostart=on

[display]
width=1920
height=1080
rotation=0
background=black
scale=1.0

[schedule]
on=07:00
off=22:00

[net]
port=8080

[schema.player.name]
pattern=[a-z0-9-]+
doc=Name shown in the management console (lowercase letters, digits and dashes)

[schema.player.site]
required=true
doc=Store or site code; there is no default, so every config must set it

[schema.player.debug]
type=bool
doc=Extra logging

[schema.player.autostart]
type=bool
values=on,off
doc=Start playing at boot

[schema.display.width]
type=int
min=320
max=7680

[schema.display.height]
type=int
min=240
max=4320

[schema.display.rotation]
type=enum
values=0,90,180,270

[schema.display.background]
type=enum
values=black,white,red,green,blue,yellow
doc=Colour behind the playlist

[schema.display.scale]
type=float
min=0.5
max=2.0

[schema.schedule.on]
pattern=[0-2][0-9]:[0-5][0-9]
doc=Time the screen turns on (24-hour HH:MM)

[schema.schedule.off]
pattern=[0-2][0-9]:[0-5][0-9]
doc=Time the screen turns off (24-hour HH:MM)

[schema.net.port]
type=int
min=1
max=65535
doc=Port the player listens on
