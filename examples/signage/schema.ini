; Schema for a digital signage player.
; Ordinary sections are defaults. Blocks starting with @ describe the
; config: [@section NAME] a section, [@rule ADDRESS] one key.

[player]
name=player
debug=no
autostart=on

[display]
width=1920
height=1080
rotation=0
background=black
scale=1.0

[schedule]
on=07:00
off=22:00

[net]
port=8080

[@section player]
title=Player
doc=Who this player is and how it starts
keys=site,name,autostart,debug

[@rule player.name]
pattern=[a-z0-9-]+
format=lowercase letters, digits and dashes, e.g. lobby-east
doc=Name shown in the management console

[@rule player.site]
required=true
pattern=[0-9]{4}
format=four digits, e.g. 0142
prompt=Which store or site is this player in?
doc=Store or site code; there is no default, so every config must set it

[@rule player.debug]
type=bool
doc=Extra logging

[@rule player.autostart]
type=bool
values=on,off
doc=Start playing at boot

[@section display]
title=Display
doc=The screen and how content fills it

[@rule display.width]
type=int
min=320
max=7680
format=pixels, 320 to 7680
doc=Screen width

[@rule display.height]
type=int
min=240
max=4320
format=pixels, 240 to 4320
doc=Screen height

[@rule display.rotation]
type=enum
values=0,90,180,270
format=degrees clockwise: 0, 90, 180 or 270
doc=Rotation for screens mounted on their side

[@rule display.background]
type=enum
values=black,white,red,green,blue,yellow
doc=Colour behind the playlist

[@rule display.scale]
type=float
min=0.5
max=2.0
format=a number from 0.5 to 2.0; 1.0 is actual size
doc=Content scaling

[@section schedule]
title=Schedule
doc=When the screen is on

[@rule schedule.on]
pattern=([01][0-9]|2[0-3]):[0-5][0-9]
format=HH:MM, 24-hour, e.g. 07:30
prompt=What time should the screen turn on?
doc=Time the screen turns on

[@rule schedule.off]
pattern=([01][0-9]|2[0-3]):[0-5][0-9]
format=HH:MM, 24-hour, e.g. 22:00
prompt=What time should the screen turn off?
doc=Time the screen turns off

[@section net]
title=Network

[@rule net.port]
type=int
min=1
max=65535
format=a number from 1 to 65535
doc=Port the player listens on

[@ask]
title=Signage player setup
doc=A few questions about this player, its schedule and its screen.
sections=player,schedule,display
