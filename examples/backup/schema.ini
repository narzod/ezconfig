; Schema for a nightly backup job.
; Root keys work too: retries and verify are root keys here.

retries=3
verify=yes

[backup]
mode=mirror

[notify]
on_failure=true

[schema.retries]
type=int
min=0
max=10

[schema.verify]
type=bool
doc=Compare the copy with the original afterwards

[schema.backup.source]
required=true
doc=Folder to back up

[schema.backup.target]
required=true
doc=Where the copy goes

[schema.backup.mode]
type=enum
values=mirror,incremental,full
doc=mirror keeps an exact copy, incremental adds new files, full copies everything

[schema.notify.email]
pattern=[^@ ]+@[^@ ]+\.[^@ ]+
doc=Who to tell (a simple pattern until a proper email type exists)

[schema.notify.on_failure]
type=bool
