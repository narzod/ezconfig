; Schema for a nightly backup job.
; Root keys work too: retries and verify are root keys here, described
; by [@section .].

retries=3
verify=yes

[backup]
mode=mirror

[notify]
on_failure=true

[@section .]
title=General

[@rule retries]
type=int
min=0
max=10
format=a number from 0 to 10
doc=How many times to retry a failed copy

[@rule verify]
type=bool
doc=Compare the copy with the original afterwards

[@section backup]
title=Backup
doc=What is copied, and where to
keys=source,target,mode

[@rule backup.source]
required=true
format=a folder path (e.g. D:\Photos)
prompt=Which folder should be backed up?
doc=Folder to back up

[@rule backup.target]
required=true
format=a folder path (e.g. E:\Backup)
prompt=Where should the copy go?
doc=Where the copy goes

[@rule backup.mode]
type=enum
values=mirror,incremental,full
doc=mirror keeps an exact copy, incremental adds new files, full copies everything

[@section notify]
title=Notifications

[@rule notify.email]
pattern=[^@\s]+@[^@\s]+\.[^@\s]+
format=an email address (e.g. it@example.com)
doc=Who to tell

[@rule notify.on_failure]
type=bool
doc=Send an email when a backup fails

; No sections= here: setup walks every section with rules, root first.
[@setup]
title=Nightly backup setup
